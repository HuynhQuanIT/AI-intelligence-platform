name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: ai-service (pytest + PostgreSQL/pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aiplatform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d aiplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://platform:platform_dev_password@localhost:5432/aiplatform
      # Thiếu DB thì job phải ĐỎ, không được âm thầm bỏ qua test tích hợp.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements-dev.txt

      - name: Create database schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=platform_dev_password psql -h localhost -U platform -d aiplatform \
            -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Run tests
        working-directory: ai-service
        run: pytest -v

  frontend:
    name: frontend (type-check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: backend (dotnet build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build backend/AIPlatform.Api/AIPlatform.Api.csproj -c Release

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file with the example environment
        run: |
          cp .env.example .env
          docker compose config --quiet