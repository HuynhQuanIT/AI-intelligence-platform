services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: Development
      AiService__BaseUrl: "http://ai-service:8000"
    depends_on:
      ai-service:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    environment:
      DATABASE_URL: "postgresql://platform:platform_dev_password@postgres:5432/aiplatform"

      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"

      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.8-flash}"
      GEMINI_TEMPERATURE: "${GEMINI_TEMPERATURE:-0.2}"
      GEMINI_MAX_OUTPUT_TOKENS: "${GEMINI_MAX_OUTPUT_TOKENS:-2048}"

      GEMINI_INPUT_USD_PER_1M_TOKENS: "${GEMINI_INPUT_USD_PER_1M_TOKENS:-0}"
      GEMINI_OUTPUT_USD_PER_1M_TOKENS: "${GEMINI_OUTPUT_USD_PER_1M_TOKENS:-0}"
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-768}"

      # Tinh chỉnh truy xuất và agent (xem .env.example)
      MIN_SIMILARITY: "${MIN_SIMILARITY:-0.60}"
      SEMANTIC_MARGIN: "${SEMANTIC_MARGIN:-0.10}"
      LEXICAL_MIN_SCORE: "${LEXICAL_MIN_SCORE:-0.5}"
      RRF_SEMANTIC_WEIGHT: "${RRF_SEMANTIC_WEIGHT:-1.0}"
      RRF_LEXICAL_WEIGHT: "${RRF_LEXICAL_WEIGHT:-0.5}"
      AGENT_MAX_TOOL_ROUNDS: "${AGENT_MAX_TOOL_ROUNDS:-4}"

      # local = lưu file vào volume "uploads"; s3 = dùng kho tương thích S3 (xem profile s3)
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      UPLOAD_DIR: "/data/uploads"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "platform"
      MINIO_SECRET_KEY: "minio_dev_password"
      MINIO_BUCKET: "${MINIO_BUCKET:-documents}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiplatform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d aiplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Tùy chọn: chỉ chạy khi dùng --profile s3. MinIO đã bị gỡ khỏi Docker Hub và
  # quay.io trả 401, nên mặc định không phụ thuộc vào image này.
  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  uploads: